[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loopspec"
version = "3.0.0"
description = "CLI for the LoopSpec self-correcting AI development protocol"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "Chahat Upadhyay"}]
keywords = ["ai", "protocol", "development", "self-correcting", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
loopspec = "cli.loopspec:main"

[project.urls]
Homepage = "https://github.com/ChahatUpadhyay/LoopSpec"
Repository = "https://github.com/ChahatUpadhyay/LoopSpec"

[tool.setuptools.packages.find]
include = ["cli*"]

[tool.setuptools.package-data]
cli = ["templates/*"]
