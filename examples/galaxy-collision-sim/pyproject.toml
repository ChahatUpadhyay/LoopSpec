[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "galaxy-collision-sim"
version = "0.1.0"
description = "Scientifically plausible GPU-accelerated galaxy collision visualization"
authors = [{name = "Galaxy Sim Team"}]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "PyQt6>=6.4.0",
    "PyOpenGL>=3.1.6",
    "vispy>=0.9.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
