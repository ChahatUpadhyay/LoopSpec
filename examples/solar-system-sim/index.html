<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System Simulator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #ui-overlay {
            position: fixed;
            top: 10px;
            left: 10px;
            color: white;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            max-width: 300px;
        }
        #fps-counter {
            position: fixed;
            top: 10px;
            right: 10px;
            color: #0f0;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 12px;
            border-radius: 4px;
            z-index: 100;
        }
        #controls {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 100;
        }
        .control-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .control-btn:hover {
            background: rgba(255, 255, 255, 0.4);
        }
        #planet-info {
            position: fixed;
            top: 50%;
            right: 10px;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px;
            border-radius: 8px;
            max-width: 250px;
            display: none;
            z-index: 100;
        }
        #planet-info h3 {
            margin-bottom: 10px;
            color: #4a9eff;
        }
        #planet-info p {
            margin: 5px 0;
            font-size: 13px;
        }
        #speed-display {
            position: fixed;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            z-index: 100;
        }
        #instructions {
            position: fixed;
            bottom: 10px;
            right: 10px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 11px;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px;
            border-radius: 4px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="ui-overlay">
        <h2>Solar System Simulator</h2>
        <p style="font-size: 12px; margin-top: 10px;">Click on a planet to see details</p>
    </div>
    
    <div id="fps-counter">FPS: --</div>
    
    <div id="controls">
        <button class="control-btn" id="pause-btn">Pause</button>
        <button class="control-btn" id="play-btn">Play</button>
        <button class="control-btn" id="slow-btn">Slower</button>
        <button class="control-btn" id="fast-btn">Faster</button>
        <button class="control-btn" id="reverse-btn">Reverse</button>
    </div>
    
    <div id="speed-display">Speed: 1x</div>
    
    <div id="planet-info">
        <h3 id="planet-name">Planet</h3>
        <p>Mass: <span id="planet-mass">--</span></p>
        <p>Diameter: <span id="planet-diameter">--</span></p>
        <p>Orbital Period: <span id="planet-period">--</span></p>
    </div>
    
    <div id="instructions">
        Space: Pause/Play | Arrows: Speed | +/-: Zoom | Drag: Rotate | Scroll: Zoom
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.162.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.162.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- SCENE SETUP ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // --- LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0x333333);
        scene.add(ambientLight);

        const sunLight = new THREE.PointLight(0xffffff, 2, 1000);
        sunLight.position.set(0, 0, 0);
        scene.add(sunLight);

        // --- CAMERA POSITION ---
        camera.position.set(0, 100, 200);

        // --- CONTROLS ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableRotate = true;
        controls.enableZoom = true;
        controls.enablePan = true;
        controls.update();

        // --- PLANET DATA ---
        const planetData = [
            { name: 'Mercury', radius: 0.8, distance: 20, orbitalPeriod: 88, color: 0x8c8c8c, mass: '3.30 × 10^23 kg', diameter: '4,879 km', orbitalPeriodDays: 88 },
            { name: 'Venus', radius: 1.5, distance: 30, orbitalPeriod: 225, color: 0xe6c87a, mass: '4.87 × 10^24 kg', diameter: '12,104 km', orbitalPeriodDays: 225 },
            { name: 'Earth', radius: 1.6, distance: 45, orbitalPeriod: 365, color: 0x4a90d9, mass: '5.97 × 10^24 kg', diameter: '12,742 km', orbitalPeriodDays: 365 },
            { name: 'Mars', radius: 1.2, distance: 60, orbitalPeriod: 687, color: 0xc1440e, mass: '6.42 × 10^23 kg', diameter: '6,779 km', orbitalPeriodDays: 687 },
            { name: 'Jupiter', radius: 5.0, distance: 100, orbitalPeriod: 4333, color: 0xd4a574, mass: '1.90 × 10^27 kg', diameter: '139,820 km', orbitalPeriodDays: 4333 },
            { name: 'Saturn', radius: 4.2, distance: 140, orbitalPeriod: 10759, color: 0xf4d59e, mass: '5.68 × 10^26 kg', diameter: '116,460 km', orbitalPeriodDays: 10759 },
            { name: 'Uranus', radius: 2.5, distance: 180, orbitalPeriod: 30687, color: 0x7de3f4, mass: '8.68 × 10^25 kg', diameter: '50,724 km', orbitalPeriodDays: 30687 },
            { name: 'Neptune', radius: 2.4, distance: 220, orbitalPeriod: 60190, color: 0x3d5ef5, mass: '1.02 × 10^26 kg', diameter: '49,244 km', orbitalPeriodDays: 60190 }
        ];

        // --- SUN ---
        const sunGeometry = new THREE.SphereGeometry(8, 32, 32);
        const sunMaterial = new THREE.MeshBasicMaterial({ 
            color: 0xffdd00,
            emissive: 0xffdd00
        });
        const sun = new THREE.Mesh(sunGeometry, sunMaterial);
        sun.position.set(0, 0, 0);
        scene.add(sun);

        // Sun glow
        const glowGeometry = new THREE.SphereGeometry(10, 32, 32);
        const glowMaterial = new THREE.MeshBasicMaterial({
            color: 0xffaa00,
            transparent: true,
            opacity: 0.3
        });
        const sunGlow = new THREE.Mesh(glowGeometry, glowMaterial);
        sun.add(sunGlow);

        // --- PLANETS ---
        const planets = [];
        const planetMeshes = [];

        planetData.forEach((data, index) => {
            const geometry = new THREE.SphereGeometry(data.radius, 32, 32);
            const material = new THREE.MeshPhongMaterial({ color: data.color });
            const planet = new THREE.Mesh(geometry, material);
            
            planet.position.x = data.distance;
            planet.name = data.name;
            planet.orbitalDistance = data.distance;
            planet.orbitalPeriod = data.orbitalPeriod;
            planet.orbitalSpeed = 1 / data.orbitalPeriod;
            planet.angle = Math.random() * Math.PI * 2;
            planet.data = data;
            
            scene.add(planet);
            planets.push(planet);
            planetMeshes.push(planet);

            // Orbital trail
            const trailGeometry = new THREE.BufferGeometry();
            const trailPositions = new Float32Array(300 * 3);
            trailGeometry.setAttribute('position', new THREE.BufferAttribute(trailPositions, 3));
            const trailMaterial = new THREE.LineBasicMaterial({ 
                color: data.color, 
                transparent: true, 
                opacity: 0.5 
            });
            const trail = new THREE.Line(trailGeometry, trailMaterial);
            trail.trailPoints = [];
            planet.trail = trail;
            scene.add(trail);
        });

        // --- MOON ---
        const moonGeometry = new THREE.SphereGeometry(0.4, 16, 16);
        const moonMaterial = new THREE.MeshPhongMaterial({ color: 0xaaaaaa });
        const moon = new THREE.Mesh(moonGeometry, moonMaterial);
        moon.position.x = 3;
        moon.orbitalSpeed = 0.05;
        moon.angle = 0;
        const earth = planets.find(p => p.name === 'Earth');
        earth.add(moon);

        // --- SATURN'S RINGS ---
        const saturn = planets.find(p => p.name === 'Saturn');
        const ringGeometry = new THREE.RingGeometry(5, 8, 64);
        const ringMaterial = new THREE.MeshBasicMaterial({
            color: 0xc4a574,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.7
        });
        const saturnRing = new THREE.Mesh(ringGeometry, ringMaterial);
        saturnRing.rotation.x = Math.PI / 2;
        saturn.add(saturnRing);
        saturn.ring = saturnRing;

        // --- ASTEROID BELT ---
        const asteroidGeometry = new THREE.BufferGeometry();
        const asteroidCount = 500;
        const asteroidPositions = new Float32Array(asteroidCount * 3);
        
        for (let i = 0; i < asteroidCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const distance = 75 + Math.random() * 15;
            const y = (Math.random() - 0.5) * 5;
            
            asteroidPositions[i * 3] = Math.cos(angle) * distance;
            asteroidPositions[i * 3 + 1] = y;
            asteroidPositions[i * 3 + 2] = Math.sin(angle) * distance;
        }
        
        asteroidGeometry.setAttribute('position', new THREE.BufferAttribute(asteroidPositions, 3));
        const asteroidMaterial = new THREE.PointsMaterial({
            color: 0x888888,
            size: 0.5
        });
        const asteroidBelt = new THREE.Points(asteroidGeometry, asteroidMaterial);
        scene.add(asteroidBelt);

        // --- TIME CONTROL ---
        const timeControl = {
            speed: 1,
            paused: false,
            pause: function() { this.paused = true; },
            play: function() { this.paused = false; },
            setSpeed: function(newSpeed) { this.speed = newSpeed; },
            reverseTime: function() { this.speed *= -1; }
        };

        // --- FPS COUNTER ---
        const fpsCounter = {
            fps: 0,
            frameCount: 0,
            lastTime: performance.now()
        };

        // --- KEYBOARD SHORTCUTS ---
        document.addEventListener('keydown', (event) => {
            switch(event.code) {
                case 'Space':
                    event.preventDefault();
                    timeControl.paused = !timeControl.paused;
                    break;
                case 'ArrowUp':
                    timeControl.speed = Math.min(timeControl.speed * 1.5, 10);
                    break;
                case 'ArrowDown':
                    timeControl.speed = Math.max(timeControl.speed / 1.5, 0.1);
                    break;
                case 'Equal':
                case 'NumpadAdd':
                    camera.position.multiplyScalar(0.9);
                    break;
                case 'Minus':
                case 'NumpadSubtract':
                    camera.position.multiplyScalar(1.1);
                    break;
                case 'Escape':
                    camera.position.set(0, 100, 200);
                    controls.reset();
                    break;
            }
            document.getElementById('speed-display').textContent = `Speed: ${timeControl.speed.toFixed(1)}x`;
        });

        // --- BUTTON CONTROLS ---
        document.getElementById('pause-btn').addEventListener('click', () => timeControl.pause());
        document.getElementById('play-btn').addEventListener('click', () => timeControl.play());
        document.getElementById('slow-btn').addEventListener('click', () => {
            timeControl.speed = Math.max(timeControl.speed / 2, 0.1);
            document.getElementById('speed-display').textContent = `Speed: ${timeControl.speed.toFixed(1)}x`;
        });
        document.getElementById('fast-btn').addEventListener('click', () => {
            timeControl.speed = Math.min(timeControl.speed * 2, 10);
            document.getElementById('speed-display').textContent = `Speed: ${timeControl.speed.toFixed(1)}x`;
        });
        document.getElementById('reverse-btn').addEventListener('click', () => {
            timeControl.reverseTime();
            document.getElementById('speed-display').textContent = `Speed: ${timeControl.speed.toFixed(1)}x`;
        });

        // --- PLANET CLICK ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        renderer.domElement.addEventListener('click', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(planets);
            
            if (intersects.length > 0) {
                const planet = intersects[0].object;
                document.getElementById('planet-info').style.display = 'block';
                document.getElementById('planet-name').textContent = planet.name;
                document.getElementById('planet-mass').textContent = planet.data.mass;
                document.getElementById('planet-diameter').textContent = planet.data.diameter;
                document.getElementById('planet-period').textContent = planet.data.orbitalPeriodDays + ' days';
            } else {
                document.getElementById('planet-info').style.display = 'none';
            }
        });

        // --- RESIZE HANDLER ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            if (!timeControl.paused) {
                // Update planet positions
                planets.forEach(planet => {
                    planet.angle += planet.orbitalSpeed * timeControl.speed * 0.01;
                    planet.position.x = Math.cos(planet.angle) * planet.orbitalDistance;
                    planet.position.z = Math.sin(planet.angle) * planet.orbitalDistance;
                    
                    // Update trail
                    planet.trail.trailPoints.push(planet.position.x, planet.position.y, planet.position.z);
                    if (planet.trail.trailPoints.length > 300) {
                        planet.trail.trailPoints.splice(0, 3);
                    }
                    
                    const positions = planet.trail.geometry.attributes.position.array;
                    for (let i = 0; i < planet.trail.trailPoints.length; i++) {
                        positions[i] = planet.trail.trailPoints[i];
                    }
                    planet.trail.geometry.attributes.position.needsUpdate = true;
                    planet.trail.geometry.setDrawRange(0, planet.trail.trailPoints.length / 3);
                });

                // Update moon
                moon.angle += moon.orbitalSpeed * timeControl.speed * 0.1;
                moon.position.x = Math.cos(moon.angle) * 3;
                moon.position.z = Math.sin(moon.angle) * 3;

                // Rotate asteroid belt
                asteroidBelt.rotation.y += 0.0001 * timeControl.speed;
            }

            // Rotate sun
            sun.rotation.y += 0.001;

            // Update FPS
            fpsCounter.frameCount++;
            const currentTime = performance.now();
            if (currentTime - fpsCounter.lastTime >= 1000) {
                fpsCounter.fps = fpsCounter.frameCount;
                fpsCounter.frameCount = 0;
                fpsCounter.lastTime = currentTime;
                document.getElementById('fps-counter').textContent = `FPS: ${fpsCounter.fps}`;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // --- EXPOSE FOR TESTING ---
        window.__SOLAR_SIM__ = {
            scene,
            camera,
            renderer,
            controls,
            planets: planetMeshes,
            sun,
            asteroidBelt,
            moon,
            timeControl,
            fpsCounter
        };
    </script>
</body>
</html>
