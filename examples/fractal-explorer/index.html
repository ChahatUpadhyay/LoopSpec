<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fractal Explorer — LoopSpec v3 Protocol Test</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #0d1117; color: #c9d1d9;
    display: flex; height: 100vh; overflow: hidden;
  }
  #sidebar {
    width: 280px; min-width: 280px;
    background: #161b22; border-right: 1px solid #30363d;
    padding: 16px; display: flex; flex-direction: column; gap: 14px;
    overflow-y: auto;
  }
  #sidebar h1 {
    font-size: 18px; color: #58a6ff; margin-bottom: 4px;
    display: flex; align-items: center; gap: 8px;
  }
  #sidebar h1 span { font-size: 22px; }
  .section { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 12px; }
  .section h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #8b949e; margin-bottom: 8px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #8b949e; }
  label span { display: flex; justify-content: space-between; }
  select, input[type=range] { width: 100%; background: #21262d; color: #c9d1d9; border: 1px solid #30363d; border-radius: 4px; padding: 6px; font-size: 13px; }
  select:focus, input:focus { outline: 1px solid #58a6ff; }
  input[type=range] { padding: 0; height: 6px; -webkit-appearance: none; appearance: none; border: none; border-radius: 3px; cursor: pointer; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #58a6ff; cursor: pointer; }
  button {
    background: #21262d; color: #c9d1d9; border: 1px solid #30363d;
    border-radius: 6px; padding: 8px 12px; font-size: 13px; cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: #30363d; }
  button.primary { background: #238636; border-color: #2ea043; color: #fff; }
  button.primary:hover { background: #2ea043; }
  button.active { background: #1f6feb; border-color: #58a6ff; color: #fff; }
  .btn-row { display: flex; gap: 6px; }
  .btn-row button { flex: 1; }
  #info {
    font-size: 12px; color: #8b949e; line-height: 1.6;
    font-family: 'Consolas', 'Courier New', monospace;
  }
  #info .val { color: #58a6ff; }
  #canvasWrap {
    flex: 1; display: flex; align-items: center; justify-content: center;
    background: #010409; position: relative; overflow: hidden;
  }
  canvas { display: block; cursor: crosshair; }
  #renderTime {
    position: absolute; top: 10px; right: 10px;
    background: rgba(0,0,0,0.7); color: #8b949e; padding: 4px 10px;
    border-radius: 4px; font-size: 12px; font-family: monospace;
  }
  .tag { display: inline-block; background: #1f6feb22; color: #58a6ff; font-size: 10px; padding: 2px 6px; border-radius: 3px; margin-top: 4px; }
</style>
</head>
<body>
<div id="sidebar">
  <h1><span>✦</span> Fractal Explorer</h1>
  <div class="tag">LoopSpec v3 Protocol Test</div>

  <div class="section">
    <h3>Mode</h3>
    <div class="btn-row">
      <button id="btnMandelbrot" class="active" onclick="setMode('mandelbrot')">Mandelbrot</button>
      <button id="btnJulia" onclick="setMode('julia')">Julia Set</button>
    </div>
  </div>

  <div class="section">
    <h3>Color Scheme</h3>
    <select id="colorScheme" onchange="render()">
      <option value="classic">Classic (Blue-White)</option>
      <option value="rainbow">HSL Rainbow</option>
      <option value="fire">Fire (Red-Yellow)</option>
      <option value="ocean">Ocean (Cyan-Blue)</option>
      <option value="grayscale">Grayscale</option>
    </select>
  </div>

  <div class="section">
    <h3>Detail</h3>
    <label>
      <span>Max Iterations <b id="iterVal">200</b></span>
      <input type="range" id="maxIter" min="50" max="2000" value="200" step="10" oninput="iterVal.textContent=this.value" onchange="render()">
    </label>
  </div>

  <div class="section">
    <h3>Controls</h3>
    <div class="btn-row">
      <button class="primary" id="btnReset" onclick="resetView()">⟲ Reset View</button>
    </div>
    <p style="font-size:11px; color:#484f58; margin-top:8px; line-height:1.5;">
      <b>Scroll</b> to zoom &nbsp;|&nbsp; <b>Drag</b> to pan<br>
      <b>Click</b> in Mandelbrot → set Julia c
    </p>
  </div>

  <div class="section">
    <h3>Info</h3>
    <div id="info">
      <div>Mode: <span class="val" id="infoMode">Mandelbrot</span></div>
      <div>Center: <span class="val" id="infoCenter">-0.5 + 0i</span></div>
      <div>Cursor: <span class="val" id="infoCursor">— + —i</span></div>
      <div>Zoom: <span class="val" id="infoZoom">1.0×</span></div>
      <div>Julia c: <span class="val" id="infoJuliaC">-0.7 + 0.27i</span></div>
      <div>Render: <span class="val" id="infoRender">—</span></div>
    </div>
  </div>
</div>

<div id="canvasWrap">
  <canvas id="fractalCanvas"></canvas>
  <div id="renderTime">—</div>
</div>

<script>
// ================================================================
// Fractal Explorer — All-in-one implementation
// Criteria: C1-C15
// ================================================================

// --- State ---
let fractalType = 'mandelbrot'; // C10
let centerX = -0.5, centerY = 0;
let zoom = 1; // C8
let juliaC = { r: -0.7, i: 0.27 }; // C2, C11
let maxIterations = 200; // C6
let colorScheme = 'classic'; // C5
let isPanning = false, panStartX, panStartY, panCenterX, panCenterY; // C3

const canvas = document.getElementById('fractalCanvas');
const ctx = canvas.getContext('2d');
let worker = null;
let renderPending = false;

// --- Default view for reset (C9) ---
const DEFAULT = { cx: -0.5, cy: 0, zoom: 1 };

// --- Canvas sizing (C12: >= 800x600) ---
function resizeCanvas() {
  const wrap = document.getElementById('canvasWrap');
  canvas.width = Math.max(800, wrap.clientWidth);
  canvas.height = Math.max(600, wrap.clientHeight);
  render();
}
window.addEventListener('resize', resizeCanvas);

// --- Web Worker (C14: non-blocking, C1: Mandelbrot, C2: Julia) ---
const workerCode = `
self.onmessage = function(e) {
  const { width, height, centerX, centerY, zoom, maxIter, type, juliaC, colorScheme } = e.data;
  const pixels = new Uint8ClampedArray(width * height * 4);
  const scaleX = 3.5 / (width * zoom);
  const scaleY = 2.5 / (height * zoom);

  for (let py = 0; py < height; py++) {
    for (let px = 0; px < width; px++) {
      const x0 = centerX + (px - width / 2) * scaleX;
      const y0 = centerY + (py - height / 2) * scaleY;

      let x, y, cr, ci;
      if (type === 'mandelbrot') {
        x = 0; y = 0; cr = x0; ci = y0;
      } else {
        x = x0; y = y0; cr = juliaC.r; ci = juliaC.i;
      }

      let iter = 0;
      while (x * x + y * y <= 4 && iter < maxIter) {
        const xNew = x * x - y * y + cr;
        y = 2 * x * y + ci;
        x = xNew;
        iter++;
      }

      const idx = (py * width + px) * 4;
      if (iter === maxIter) {
        pixels[idx] = 0; pixels[idx+1] = 0; pixels[idx+2] = 0; pixels[idx+3] = 255;
      } else {
        const t = iter / maxIter;
        let r, g, b;
        if (colorScheme === 'classic') {
          r = Math.floor(9 * (1 - t) * t * t * t * 255);
          g = Math.floor(15 * (1 - t) * (1 - t) * t * t * 255);
          b = Math.floor(8.5 * (1 - t) * (1 - t) * (1 - t) * t * 255);
        } else if (colorScheme === 'rainbow') {
          const h = t * 360;
          const s = 1, l = 0.5;
          const c2 = (1 - Math.abs(2 * l - 1)) * s;
          const x2 = c2 * (1 - Math.abs((h / 60) % 2 - 1));
          const m = l - c2 / 2;
          let r1, g1, b1;
          if (h < 60) { r1=c2; g1=x2; b1=0; }
          else if (h < 120) { r1=x2; g1=c2; b1=0; }
          else if (h < 180) { r1=0; g1=c2; b1=x2; }
          else if (h < 240) { r1=0; g1=x2; b1=c2; }
          else if (h < 300) { r1=x2; g1=0; b1=c2; }
          else { r1=c2; g1=0; b1=x2; }
          r = Math.floor((r1 + m) * 255);
          g = Math.floor((g1 + m) * 255);
          b = Math.floor((b1 + m) * 255);
        } else if (colorScheme === 'fire') {
          r = Math.min(255, Math.floor(t * 3 * 255));
          g = Math.min(255, Math.floor(Math.max(0, t * 3 - 1) * 255));
          b = Math.min(255, Math.floor(Math.max(0, t * 3 - 2) * 255));
        } else if (colorScheme === 'ocean') {
          r = Math.floor(t * t * 80);
          g = Math.floor(t * 200 + 55);
          b = Math.min(255, Math.floor(t * 0.5 * 255 + 128));
        } else {
          const v = Math.floor(t * 255);
          r = v; g = v; b = v;
        }
        pixels[idx] = r; pixels[idx+1] = g; pixels[idx+2] = b; pixels[idx+3] = 255;
      }
    }
  }
  self.postMessage({ pixels, width, height });
};
`;

function createWorker() {
  if (worker) worker.terminate();
  const blob = new Blob([workerCode], { type: 'application/javascript' });
  worker = new Worker(URL.createObjectURL(blob));
  worker.onmessage = function(e) {
    const { pixels, width, height } = e.data;
    const imageData = new ImageData(pixels, width, height);
    ctx.putImageData(imageData, 0, 0);
    const elapsed = performance.now() - renderStartTime;
    document.getElementById('renderTime').textContent = `${elapsed.toFixed(0)}ms`;
    document.getElementById('infoRender').textContent = `${elapsed.toFixed(0)}ms`;
    console.log(`Render time: ${elapsed.toFixed(0)}ms`); // C13 evidence
    renderPending = false;
  };
}

let renderStartTime = 0;

function render() {
  if (renderPending) return;
  renderPending = true;
  maxIterations = parseInt(document.getElementById('maxIter').value);
  colorScheme = document.getElementById('colorScheme').value;
  renderStartTime = performance.now();

  if (!worker) createWorker();
  worker.postMessage({
    width: canvas.width,
    height: canvas.height,
    centerX, centerY, zoom,
    maxIter: maxIterations,
    type: fractalType,
    juliaC,
    colorScheme
  });
  updateInfo();
}

// --- Mode toggle (C10) ---
function setMode(mode) {
  fractalType = mode;
  document.getElementById('btnMandelbrot').className = mode === 'mandelbrot' ? 'active' : '';
  document.getElementById('btnJulia').className = mode === 'julia' ? 'active' : '';
  document.getElementById('infoMode').textContent = mode === 'mandelbrot' ? 'Mandelbrot' : 'Julia';
  if (mode === 'mandelbrot') { centerX = DEFAULT.cx; centerY = DEFAULT.cy; zoom = DEFAULT.zoom; }
  render();
}

// --- Reset (C9) ---
function resetView() {
  centerX = DEFAULT.cx; centerY = DEFAULT.cy; zoom = DEFAULT.zoom;
  document.getElementById('maxIter').value = 200;
  document.getElementById('iterVal').textContent = '200';
  render();
}

// --- Info display (C7, C8) ---
function updateInfo() {
  document.getElementById('infoCenter').textContent =
    `${centerX.toFixed(6)} ${centerY >= 0 ? '+' : '−'} ${Math.abs(centerY).toFixed(6)}i`;
  document.getElementById('infoZoom').textContent = `${zoom.toFixed(2)}×`;
  document.getElementById('infoJuliaC').textContent =
    `${juliaC.r.toFixed(4)} ${juliaC.i >= 0 ? '+' : '−'} ${Math.abs(juliaC.i).toFixed(4)}i`;
}

// --- Mouse: pan (C3) ---
canvas.addEventListener('mousedown', (e) => {
  if (e.button === 0) {
    isPanning = true;
    panStartX = e.clientX; panStartY = e.clientY;
    panCenterX = centerX; panCenterY = centerY;
    canvas.style.cursor = 'grabbing';
  }
});
window.addEventListener('mousemove', (e) => {
  // C7: coordinate display
  const rect = canvas.getBoundingClientRect();
  const px = e.clientX - rect.left;
  const py = e.clientY - rect.top;
  if (px >= 0 && py >= 0 && px <= canvas.width && py <= canvas.height) {
    const scaleX = 3.5 / (canvas.width * zoom);
    const scaleY = 2.5 / (canvas.height * zoom);
    const fx = centerX + (px - canvas.width / 2) * scaleX;
    const fy = centerY + (py - canvas.height / 2) * scaleY;
    document.getElementById('infoCursor').textContent =
      `${fx.toFixed(6)} ${fy >= 0 ? '+' : '−'} ${Math.abs(fy).toFixed(6)}i`;
  }

  if (isPanning) {
    const scaleX = 3.5 / (canvas.width * zoom);
    const scaleY = 2.5 / (canvas.height * zoom);
    centerX = panCenterX - (e.clientX - panStartX) * scaleX;
    centerY = panCenterY - (e.clientY - panStartY) * scaleY;
    render();
  }
});
window.addEventListener('mouseup', () => {
  if (isPanning) { isPanning = false; canvas.style.cursor = 'crosshair'; }
});

// --- Mouse: zoom (C4) ---
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const scaleX = 3.5 / (canvas.width * zoom);
  const scaleY = 2.5 / (canvas.height * zoom);
  const fx = centerX + (mx - canvas.width / 2) * scaleX;
  const fy = centerY + (my - canvas.height / 2) * scaleY;

  const factor = e.deltaY < 0 ? 1.3 : 1 / 1.3;
  zoom *= factor;

  // Re-center on cursor position
  const newScaleX = 3.5 / (canvas.width * zoom);
  const newScaleY = 2.5 / (canvas.height * zoom);
  centerX = fx - (mx - canvas.width / 2) * newScaleX;
  centerY = fy - (my - canvas.height / 2) * newScaleY;

  render();
}, { passive: false });

// --- Click to set Julia c (C11) ---
canvas.addEventListener('click', (e) => {
  if (isPanning) return;
  if (fractalType === 'mandelbrot') {
    const rect = canvas.getBoundingClientRect();
    const px = e.clientX - rect.left;
    const py = e.clientY - rect.top;
    const scaleX = 3.5 / (canvas.width * zoom);
    const scaleY = 2.5 / (canvas.height * zoom);
    juliaC.r = centerX + (px - canvas.width / 2) * scaleX;
    juliaC.i = centerY + (py - canvas.height / 2) * scaleY;
    setMode('julia');
  }
});

// --- Init ---
createWorker();
resizeCanvas();
</script>
</body>
</html>
